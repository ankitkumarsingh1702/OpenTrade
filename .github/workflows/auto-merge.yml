name: Auto-merge internal pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  queue:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type == 'User' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.pull_request.base.ref == 'dev') ||
      (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'dev'))
    runs-on: ubuntu-latest
    steps:
      - name: Queue protected merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$BASE_BRANCH" == "main" ]]; then
            merge_method=merge
          else
            merge_method=squash
          fi

          if ! gh pr merge "$PR_URL" --auto --"$merge_method"; then
            gh pr merge "$PR_URL" --"$merge_method"
          fi

          for _ in {1..120}; do
            state="$(gh pr view "$PR_URL" --json state --jq '.state')"
            if [[ "$state" == "MERGED" ]]; then
              if [[ "$BASE_BRANCH" != "dev" ]]; then
                exit 0
              fi
              merged_sha="$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid')"
              dev_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')"
              if [[ "$merged_sha" == "$dev_sha" ]]; then
                gh workflow run deploy-dev.yml --repo "$GITHUB_REPOSITORY" --ref dev
              else
                echo "A newer dev merge will dispatch the current head"
              fi
              exit 0
            fi
            if [[ "$state" == "CLOSED" ]]; then
              echo "Pull request closed without merging"
              exit 1
            fi
            sleep 10
          done

          echo "Timed out waiting for protected merge"
          exit 1
